<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi escena</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene stats>
      <a-assets>
        <a-asset-item id="objeto" src="activos/objeto.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#objeto" position="0 0 -2"></a-entity>

      <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
